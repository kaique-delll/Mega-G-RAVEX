<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestão de Manutenção por Placa com Importação de Planilha</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- SheetJS para Leitura de Excel (.xlsx / .csv) -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <style>
    .highlight-search {
      animation: pulseHighlight 1.5s infinite;
      border-color: #3b82f6 !important;
      box-shadow: 0 0 15px rgba(59, 130, 246, 0.6);
    }
    @keyframes pulseHighlight {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.03); }
    }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans">

  <!-- CABEÇALHO -->
  <header class="bg-slate-800 border-b border-slate-700 px-6 py-4 flex flex-wrap items-center justify-between gap-4 sticky top-0 z-30">
    <div class="flex items-center space-x-3">
      <i data-lucide="wrench" class="w-7 h-7 text-blue-400"></i>
      <div>
        <h1 class="text-xl font-bold text-white leading-tight">Gestão de Manutenção & Check-list por Placa</h1>
        <p class="text-xs text-slate-400">Importação e Exportação por Planilha Excel/CSV</p>
      </div>
    </div>

    <!-- BOTÕES E AÇÕES DA BARRA SUPERIOR -->
    <div class="flex items-center space-x-3 w-full md:w-auto">
      <div class="relative flex-1 md:w-60">
        <i data-lucide="search" class="w-4 h-4 absolute left-3 top-3 text-slate-400"></i>
        <input id="searchInput" type="text" placeholder="Buscar Placa ou Modelo..." 
               class="w-full bg-slate-900 border border-slate-700 text-slate-100 text-sm rounded-lg pl-9 pr-3 py-2 focus:outline-none focus:border-blue-500">
      </div>
      
      <!-- BOTÃO DE IMPORTAR PLANILHA -->
      <label class="bg-indigo-600 hover:bg-indigo-500 text-white font-medium text-sm px-3.5 py-2 rounded-lg flex items-center space-x-2 transition cursor-pointer" title="Importar arquivo Excel (.xlsx) ou CSV">
        <i data-lucide="file-up" class="w-4 h-4"></i>
        <span class="hidden sm:inline">Importar Planilha</span>
        <input type="file" id="inputImportarExcel" accept=".xlsx, .xls, .csv" onchange="importarPlanilha(event)" class="hidden">
      </label>

      <!-- BOTÃO DE EXPORTAR PLANILHA -->
      <button onclick="exportarExcel()" class="bg-emerald-600 hover:bg-emerald-500 text-white font-medium text-sm px-3.5 py-2 rounded-lg flex items-center space-x-2 transition" title="Exportar para Excel/CSV">
        <i data-lucide="file-spreadsheet" class="w-4 h-4"></i>
        <span class="hidden sm:inline">Baixar Planilha</span>
      </button>

      <button onclick="abrirModalNovoServico()" class="bg-blue-600 hover:bg-blue-500 text-white font-medium text-sm px-4 py-2 rounded-lg flex items-center space-x-2 transition">
        <i data-lucide="plus-circle" class="w-4 h-4"></i>
        <span>Novo Veículo</span>
      </button>
      
      <button onclick="limparTudo()" class="bg-red-900/40 hover:bg-red-800/60 text-red-300 border border-red-700/50 font-medium text-sm px-3 py-2 rounded-lg flex items-center space-x-1 transition" title="Limpar Registros">
        <i data-lucide="trash-2" class="w-4 h-4"></i>
      </button>
    </div>
  </header>

  <!-- COLUNAS KANBAN -->
  <main class="flex-1 p-6 grid grid-cols-1 md:grid-cols-3 gap-6 overflow-y-auto">

    <!-- COLUNA 1: AGUARDANDO SERVIÇO -->
    <section class="bg-slate-800/80 border border-slate-700 rounded-xl p-4 flex flex-col">
      <div class="flex items-center justify-between mb-4 border-b border-slate-700 pb-2">
        <div class="flex items-center space-x-2">
          <span class="w-3 h-3 rounded-full bg-amber-500"></span>
          <h2 class="text-base font-bold text-slate-200">Aguardando / Agendado</h2>
        </div>
        <span id="countAguardando" class="bg-slate-700 text-slate-300 text-xs px-2 py-0.5 rounded-full font-bold">0</span>
      </div>
      <div id="listaAguardando" class="flex-1 space-y-3"></div>
    </section>

    <!-- COLUNA 2: EM MANUTENÇÃO -->
    <section class="bg-slate-800/80 border border-slate-700 rounded-xl p-4 flex flex-col">
      <div class="flex items-center justify-between mb-4 border-b border-slate-700 pb-2">
        <div class="flex items-center space-x-2">
          <span class="w-3 h-3 rounded-full bg-blue-500"></span>
          <h2 class="text-base font-bold text-slate-200">Em Manutenção / Instalação</h2>
        </div>
        <span id="countAndamento" class="bg-slate-700 text-slate-300 text-xs px-2 py-0.5 rounded-full font-bold">0</span>
      </div>
      <div id="listaAndamento" class="flex-1 space-y-3"></div>
    </section>

    <!-- COLUNA 3: CONCLUÍDO -->
    <section class="bg-slate-800/80 border border-slate-700 rounded-xl p-4 flex flex-col">
      <div class="flex items-center justify-between mb-4 border-b border-slate-700 pb-2">
        <div class="flex items-center space-x-2">
          <span class="w-3 h-3 rounded-full bg-green-500"></span>
          <h2 class="text-base font-bold text-slate-200">Concluído / Liberado</h2>
        </div>
        <span id="countConcluido" class="bg-slate-700 text-slate-300 text-xs px-2 py-0.5 rounded-full font-bold">0</span>
      </div>
      <div id="listaConcluido" class="flex-1 space-y-3"></div>
    </section>

  </main>

  <!-- MODAL DE CADASTRO -->
  <div id="modalServico" class="fixed inset-0 bg-black/70 backdrop-blur-sm flex items-center justify-center hidden z-50 p-4">
    <div class="bg-slate-800 border border-slate-700 w-full max-w-lg rounded-xl p-6 shadow-2xl space-y-4 max-h-[90vh] overflow-y-auto">
      <div class="flex items-center justify-between border-b border-slate-700 pb-3">
        <h3 class="text-lg font-bold text-white flex items-center gap-2">
          <i data-lucide="car" class="w-5 h-5 text-blue-400"></i> Entrada de Veículo & Check-list
        </h3>
        <button onclick="fecharModalNovoServico()" class="text-slate-400 hover:text-white">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <form id="formServico" onsubmit="salvarServico(event)" class="space-y-4">
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Placa do Veículo</label>
            <input type="text" id="inputPlaca" required placeholder="Ex: ABC-1234" 
                   class="w-full bg-slate-900 border border-slate-700 text-slate-100 text-sm rounded-lg px-3 py-2 focus:outline-none focus:border-blue-500 font-mono font-bold uppercase">
          </div>
          <div>
            <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Modelo / Veículo</label>
            <input type="text" id="inputModelo" required placeholder="Ex: Iveco Daily 2022" 
                   class="w-full bg-slate-900 border border-slate-700 text-slate-100 text-sm rounded-lg px-3 py-2 focus:outline-none focus:border-blue-500">
          </div>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Data do Agendamento</label>
            <input type="date" id="inputDataAgendamento" 
                   class="w-full bg-slate-900 border border-slate-700 text-slate-100 text-sm rounded-lg px-3 py-2 focus:outline-none focus:border-blue-500">
          </div>
          <div>
            <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Horário Agendado</label>
            <input type="time" id="inputHoraAgendamento" 
                   class="w-full bg-slate-900 border border-slate-700 text-slate-100 text-sm rounded-lg px-3 py-2 focus:outline-none focus:border-blue-500">
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold uppercase text-slate-400 mb-2">Marque o que precisa ser feito:</label>
          <div class="grid grid-cols-2 gap-2 bg-slate-900 p-3 rounded-lg border border-slate-700 text-xs">
            <label class="flex items-center space-x-2 cursor-pointer">
              <input type="checkbox" value="Instalação de Rastreador" class="chk-item rounded text-blue-600 focus:ring-0">
              <span>Instalação Rastreador</span>
            </label>
            <label class="flex items-center space-x-2 cursor-pointer">
              <input type="checkbox" value="Instalação de Alarme" class="chk-item rounded text-blue-600 focus:ring-0">
              <span>Instalação Alarme</span>
            </label>
            <label class="flex items-center space-x-2 cursor-pointer">
              <input type="checkbox" value="Revisão Elétrica / Fusíveis" class="chk-item rounded text-blue-600 focus:ring-0">
              <span>Revisão Elétrica</span>
            </label>
            <label class="flex items-center space-x-2 cursor-pointer">
              <input type="checkbox" value="Regeneração DPF / Sensor NOx" class="chk-item rounded text-blue-600 focus:ring-0">
              <span>Regeneração DPF / NOx</span>
            </label>
            <label class="flex items-center space-x-2 cursor-pointer">
              <input type="checkbox" value="Troca de Óleo e Filtros" class="chk-item rounded text-blue-600 focus:ring-0">
              <span>Troca de Óleo / Filtros</span>
            </label>
            <label class="flex items-center space-x-2 cursor-pointer">
              <input type="checkbox" value="Manutenção de Freios" class="chk-item rounded text-blue-600 focus:ring-0">
              <span>Manutenção de Freios</span>
            </label>
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Outro serviço específico</label>
          <input type="text" id="inputOutroItem" placeholder="Ex: Reparar trava elétrica da porta" 
                 class="w-full bg-slate-900 border border-slate-700 text-slate-100 text-sm rounded-lg px-3 py-2 focus:outline-none focus:border-blue-500">
        </div>

        <div>
          <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Observações adicionais</label>
          <textarea id="inputObs" rows="2" placeholder="Ex: Veículo chega no período da manhã..." 
                    class="w-full bg-slate-900 border border-slate-700 text-slate-100 text-sm rounded-lg px-3 py-2 focus:outline-none focus:border-blue-500"></textarea>
        </div>

        <div class="flex items-center justify-end space-x-3 pt-2">
          <button type="button" onclick="fecharModalNovoServico()" class="px-4 py-2 bg-slate-700 hover:bg-slate-600 text-slate-200 text-sm rounded-lg font-medium transition">
            Cancelar
          </button>
          <button type="submit" class="px-4 py-2 bg-blue-600 hover:bg-blue-500 text-white text-sm rounded-lg font-medium transition">
            Cadastrar Veículo
          </button>
        </div>
      </form>
    </div>
  </div>

  <script>
    let manutencoes = JSON.parse(localStorage.getItem('manutencoes_checklist_agendado')) || [
      {
        id: '1',
        placa: 'ABC-1234',
        modelo: 'Iveco Daily 2022',
        status: 'aguardando',
        dataCadastro: '29/10/2026',
        dataAgendamento: '2026-10-30',
        horaAgendamento: '08:30',
        obs: 'Exemplo de cadastro inicial',
        itens: [
          { nome: 'Instalação de Rastreador', feito: false },
          { nome: 'Instalação de Alarme', feito: false }
        ]
      }
    ];

    document.addEventListener('DOMContentLoaded', () => {
      renderizarPainel();
      lucide.createIcons();

      document.getElementById('searchInput').addEventListener('input', (e) => {
        filtrarEHighlight(e.target.value.toLowerCase().trim());
      });
    });

    function salvarDados() {
      localStorage.setItem('manutencoes_checklist_agendado', JSON.stringify(manutencoes));
    }

    function renderizarPainel() {
      const elAguardando = document.getElementById('listaAguardando');
      const elAndamento = document.getElementById('listaAndamento');
      const elConcluido = document.getElementById('listaConcluido');

      const arrAguardando = manutencoes.filter(m => m.status === 'aguardando');
      const arrAndamento = manutencoes.filter(m => m.status === 'andamento');
      const arrConcluido = manutencoes.filter(m => m.status === 'concluido');

      document.getElementById('countAguardando').innerText = arrAguardando.length;
