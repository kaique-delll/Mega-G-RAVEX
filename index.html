<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Controle de Manutenção e Check-list por Placa</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    .highlight-search {
      animation: pulseHighlight 1.5s infinite;
      border-color: #3b82f6 !important;
      box-shadow: 0 0 15px rgba(59, 130, 246, 0.6);
    }
    @keyframes pulseHighlight {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.03); }
    }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans">

  <!-- CABEÇALHO -->
  <header class="bg-slate-800 border-b border-slate-700 px-6 py-4 flex flex-wrap items-center justify-between gap-4 sticky top-0 z-30">
    <div class="flex items-center space-x-3">
      <i data-lucide="wrench" class="w-7 h-7 text-blue-400"></i>
      <div>
        <h1 class="text-xl font-bold text-white leading-tight">Gestão de Manutenção & Check-list por Placa</h1>
        <p class="text-xs text-slate-400">Controle por Agendamento, Status e Exportação de Relatório</p>
      </div>
    </div>

    <!-- BUSCA E AÇÕES -->
    <div class="flex items-center space-x-3 w-full md:w-auto">
      <div class="relative flex-1 md:w-64">
        <i data-lucide="search" class="w-4 h-4 absolute left-3 top-3 text-slate-400"></i>
        <input id="searchInput" type="text" placeholder="Buscar Placa ou Modelo..." 
               class="w-full bg-slate-900 border border-slate-700 text-slate-100 text-sm rounded-lg pl-9 pr-3 py-2 focus:outline-none focus:border-blue-500">
      </div>
      
      <!-- BOTÃO EXPORTAR EXCEL / CSV -->
      <button onclick="exportarExcel()" class="bg-emerald-600 hover:bg-emerald-500 text-white font-medium text-sm px-3.5 py-2 rounded-lg flex items-center space-x-2 transition" title="Exportar dados para Excel/CSV">
        <i data-lucide="file-spreadsheet" class="w-4 h-4"></i>
        <span class="hidden sm:inline">Baixar Planilha</span>
      </button>

      <button onclick="abrirModalNovoServico()" class="bg-blue-600 hover:bg-blue-500 text-white font-medium text-sm px-4 py-2 rounded-lg flex items-center space-x-2 transition">
        <i data-lucide="plus-circle" class="w-4 h-4"></i>
        <span>Novo Veículo</span>
      </button>
      
      <button onclick="limparTudo()" class="bg-red-900/40 hover:bg-red-800/60 text-red-300 border border-red-700/50 font-medium text-sm px-3 py-2 rounded-lg flex items-center space-x-1 transition" title="Limpar Registros">
        <i data-lucide="trash-2" class="w-4 h-4"></i>
      </button>
    </div>
  </header>

  <!-- COLUNAS KANBAN -->
  <main class="flex-1 p-6 grid grid-cols-1 md:grid-cols-3 gap-6 overflow-y-auto">

    <!-- COLUNA 1: AGUARDANDO SERVIÇO -->
    <section class="bg-slate-800/80 border border-slate-700 rounded-xl p-4 flex flex-col">
      <div class="flex items-center justify-between mb-4 border-b border-slate-700 pb-2">
        <div class="flex items-center space-x-2">
          <span class="w-3 h-3 rounded-full bg-amber-500"></span>
          <h2 class="text-base font-bold text-slate-200">Aguardando / Agendado</h2>
        </div>
        <span id="countAguardando" class="bg-slate-700 text-slate-300 text-xs px-2 py-0.5 rounded-full font-bold">0</span>
      </div>
      <div id="listaAguardando" class="flex-1 space-y-3"></div>
    </section>

    <!-- COLUNA 2: EM MANUTENÇÃO -->
    <section class="bg-slate-800/80 border border-slate-700 rounded-xl p-4 flex flex-col">
      <div class="flex items-center justify-between mb-4 border-b border-slate-700 pb-2">
        <div class="flex items-center space-x-2">
          <span class="w-3 h-3 rounded-full bg-blue-500"></span>
          <h2 class="text-base font-bold text-slate-200">Em Manutenção / Instalação</h2>
        </div>
        <span id="countAndamento" class="bg-slate-700 text-slate-300 text-xs px-2 py-0.5 rounded-full font-bold">0</span>
      </div>
      <div id="listaAndamento" class="flex-1 space-y-3"></div>
    </section>

    <!-- COLUNA 3: CONCLUÍDO -->
    <section class="bg-slate-800/80 border border-slate-700 rounded-xl p-4 flex flex-col">
      <div class="flex items-center justify-between mb-4 border-b border-slate-700 pb-2">
        <div class="flex items-center space-x-2">
          <span class="w-3 h-3 rounded-full bg-green-500"></span>
          <h2 class="text-base font-bold text-slate-200">Concluído / Liberado</h2>
        </div>
        <span id="countConcluido" class="bg-slate-700 text-slate-300 text-xs px-2 py-0.5 rounded-full font-bold">0</span>
      </div>
      <div id="listaConcluido" class="flex-1 space-y-3"></div>
    </section>

  </main>

  <!-- MODAL DE CADASTRO COM AGENDAMENTO -->
  <div id="modalServico" class="fixed inset-0 bg-black/70 backdrop-blur-sm flex items-center justify-center hidden z-50 p-4">
    <div class="bg-slate-800 border border-slate-700 w-full max-w-lg rounded-xl p-6 shadow-2xl space-y-4 max-h-[90vh] overflow-y-auto">
      <div class="flex items-center justify-between border-b border-slate-700 pb-3">
        <h3 class="text-lg font-bold text-white flex items-center gap-2">
          <i data-lucide="car" class="w-5 h-5 text-blue-400"></i> Entrada de Veículo & Check-list
        </h3>
        <button onclick="fecharModalNovoServico()" class="text-slate-400 hover:text-white">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <form id="formServico" onsubmit="salvarServico(event)" class="space-y-4">
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Placa do Veículo</label>
            <input type="text" id="inputPlaca" required placeholder="Ex: ABC-1234" 
                   class="w-full bg-slate-900 border border-slate-700 text-slate-100 text-sm rounded-lg px-3 py-2 focus:outline-none focus:border-blue-500 font-mono font-bold uppercase">
          </div>
          <div>
            <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Modelo / Veículo</label>
            <input type="text" id="inputModelo" required placeholder="Ex: Iveco Daily 2022" 
                   class="w-full bg-slate-900 border border-slate-700 text-slate-100 text-sm rounded-lg px-3 py-2 focus:outline-none focus:border-blue-500">
          </div>
        </div>

        <!-- CAMPO DE DIA DO AGENDAMENTO -->
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Data do Agendamento (Opcional)</label>
            <input type="date" id="inputDataAgendamento" 
                   class="w-full bg-slate-900 border border-slate-700 text-slate-100 text-sm rounded-lg px-3 py-2 focus:outline-none focus:border-blue-500">
          </div>
          <div>
            <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Horário Agendado</label>
            <input type="time" id="inputHoraAgendamento" 
                   class="w-full bg-slate-900 border border-slate-700 text-slate-100 text-sm rounded-lg px-3 py-2 focus:outline-none focus:border-blue-500">
          </div>
        </div>

        <!-- CHECK-LIST DE ITENS -->
        <div>
          <label class="block text-xs font-semibold uppercase text-slate-400 mb-2">Marque o que precisa ser feito:</label>
          <div class="grid grid-cols-2 gap-2 bg-slate-900 p-3 rounded-lg border border-slate-700 text-xs">
            <label class="flex items-center space-x-2 cursor-pointer">
              <input type="checkbox" value="Instalação de Rastreador" class="chk-item rounded text-blue-600 focus:ring-0">
              <span>Instalação Rastreador</span>
            </label>
            <label class="flex items-center space-x-2 cursor-pointer">
              <input type="checkbox" value="Instalação de Alarme" class="chk-item rounded text-blue-600 focus:ring-0">
              <span>Instalação Alarme</span>
            </label>
            <label class="flex items-center space-x-2 cursor-pointer">
              <input type="checkbox" value="Revisão Elétrica / Fusíveis" class="chk-item rounded text-blue-600 focus:ring-0">
              <span>Revisão Elétrica</span>
            </label>
            <label class="flex items-center space-x-2 cursor-pointer">
              <input type="checkbox" value="Regeneração DPF / Sensor NOx" class="chk-item rounded text-blue-600 focus:ring-0">
              <span>Regeneração DPF / NOx</span>
            </label>
            <label class="flex items-center space-x-2 cursor-pointer">
              <input type="checkbox" value="Troca de Óleo e Filtros" class="chk-item rounded text-blue-600 focus:ring-0">
              <span>Troca de Óleo / Filtros</span>
            </label>
            <label class="flex items-center space-x-2 cursor-pointer">
              <input type="checkbox" value="Manutenção de Freios" class="chk-item rounded text-blue-600 focus:ring-0">
              <span>Manutenção de Freios</span>
            </label>
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Outro serviço específico (opcional)</label>
          <input type="text" id="inputOutroItem" placeholder="Ex: Reparar trava elétrica da porta" 
                 class="w-full bg-slate-900 border border-slate-700 text-slate-100 text-sm rounded-lg px-3 py-2 focus:outline-none focus:border-blue-500">
        </div>

        <div>
          <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Observações adicionais</label>
          <textarea id="inputObs" rows="2" placeholder="Ex: Trazer veículo sem carga..." 
                    class="w-full bg-slate-900 border border-slate-700 text-slate-100 text-sm rounded-lg px-3 py-2 focus:outline-none focus:border-blue-500"></textarea>
        </div>

        <div class="flex items-center justify-end space-x-3 pt-2">
          <button type="button" onclick="fecharModalNovoServico()" class="px-4 py-2 bg-slate-700 hover:bg-slate-600 text-slate-200 text-sm rounded-lg font-medium transition">
            Cancelar
          </button>
          <button type="submit" class="px-4 py-2 bg-blue-600 hover:bg-blue-500 text-white text-sm rounded-lg font-medium transition">
            Cadastrar Veículo
          </button>
        </div>
      </form>
    </div>
  </div>

  <script>
    let manutencoes = JSON.parse(localStorage.getItem('manutencoes_checklist_agendado')) || [
      {
        id: '1',
        placa: 'ABC-1234',
        modelo: 'Iveco Daily 2022',
        status: 'aguardando',
        dataCadastro: '29/10/2026',
        dataAgendamento: '2026-10-30',
        horaAgendamento: '08:30',
        obs: 'Veículo da frota local',
        itens: [
          { nome: 'Instalação de Rastreador', feito: false },
          { nome: 'Instalação de Alarme', feito: false }
        ]
      }
    ];

    document.addEventListener('DOMContentLoaded', () => {
      renderizarPainel();
      lucide.createIcons();

      document.getElementById('searchInput').addEventListener('input', (e) => {
        filtrarEHighlight(e.target.value.toLowerCase().trim());
      });
    });

    function salvarDados() {
      localStorage.setItem('manutencoes_checklist_agendado', JSON.stringify(manutencoes));
    }

    function renderizarPainel() {
      const elAguardando = document.getElementById('listaAguardando');
      const elAndamento = document.getElementById('listaAndamento');
      const elConcluido = document.getElementById('listaConcluido');

      const arrAguardando = manutencoes.filter(m => m.status === 'aguardando');
      const arrAndamento = manutencoes.filter(m => m.status === 'andamento');
      const arrConcluido = manutencoes.filter(m => m.status === 'concluido');

      document.getElementById('countAguardando').innerText = arrAguardando.length;
      document.getElementById('countAndamento').innerText = arrAndamento.length;
      document.getElementById('countConcluido').innerText = arrConcluido.length;

      elAguardando.innerHTML = arrAguardando.map(m => criarCardHtml(m)).join('') || semRegistrosHtml();
      elAndamento.innerHTML = arrAndamento.map(m => criarCardHtml(m)).join('') || semRegistrosHtml();
      elConcluido.innerHTML = arrConcluido.map(m => criarCardHtml(m)).join('') || semRegistrosHtml();

      lucide.createIcons();
    }

    function semRegistrosHtml() {
      return `<div class="text-center text-slate-600 text-xs py-8 border border-dashed border-slate-700/60 rounded-lg">Nenhum veículo nesta etapa</div>`;
    }

    function formatarDataBR(dataIso) {
      if (!dataIso) return null;
      const partes = dataIso.split('-');
      if (partes.length === 3) return `${partes[2]}/${partes[1]}/${partes[0]}`;
      return dataIso;
    }

    function criarCardHtml(m) {
      const concluidos = m.itens.filter(i => i.feito).length;
      const total = m.itens.length;
      const pct = total > 0 ? Math.round((concluidos / total) * 100) : 0;
      const dataAgendadaBR = formatarDataBR(m.dataAgendamento);

      const checklistHtml = m.itens.map((item, idx) => `
        <label class="flex items-center justify-between text-xs py-1 border-b border-slate-800/60 last:border-0 cursor-pointer">
          <span class="${item.feito ? 'line-through text-slate-500' : 'text-slate-200'} font-medium">
            ${item.nome}
          </span>
          <input type="checkbox" ${item.feito ? 'checked' : ''} 
                 onchange="alternarItemChecklist('${m.id}', ${idx})" 
                 class="rounded text-blue-500 focus:ring-0">
        </label>
      `).join('');

      return `
        <div data-placa="${m.placa.toLowerCase()}" class="card-manutencao bg-slate-900 border border-slate-700 rounded-lg p-3.5 shadow-md space-y-3 transition">
          <div class="flex items-start justify-between gap-2">
            <div>
              <span class="bg-blue-500/20 text-blue-400 border border-blue-500/30 px-2 py-0.5 rounded font-mono font-bold text-xs uppercase tracking-wider">${m.placa}</span>
              <h3 class="text-sm font-bold text-white mt-1">${m.modelo}</h3>
            </div>
            <button onclick="removerRegistro('${m.id}')" title="Excluir Veículo" class="text-slate-500 hover:text-red-400">
              <i data-lucide="trash" class="w-4 h-4"></i>
            </button>
          </div>

          <!-- DIA DO AGENDAMENTO (SE HOUVER) -->
          ${dataAgendadaBR ? `
            <div class="bg-amber-500/10 border border-amber-500/30 rounded p-1.5 flex items-center justify-between text-amber-300 text-xs font-semibold">
              <span class="flex items-center gap-1">
                <i data-lucide="calendar" class="w-3.5 h-3.5 text-amber-400"></i>
                Agendado para: ${dataAgendadaBR}
              </span>
              ${m.horaAgendamento ? `<span class="bg-amber-500/20 px-1.5 py-0.5 rounded text-[10px]"><i data-lucide="clock" class="w-3 h-3 inline"></i> ${m.horaAgendamento}</span>` : ''}
            </div>
          ` : ''}

          <!-- BARRA DE PROGRESSO DO CHECK-LIST -->
          <div class="space-y-1">
            <div class="flex justify-between text-[10px] text-slate-400 font-semibold">
              <span>Progresso dos Serviços</span>
              <span>${concluidos}/${total} (${pct}%)</span>
            </div>
            <div class="w-full bg-slate-800 rounded-full h-1.5 overflow-hidden">
              <div class="bg-blue-500 h-1.5 rounded-full transition-all" style="width: ${pct}%"></div>
            </div>
          </div>

          <!-- ITENS DO CHECK-LIST -->
          <div class="bg-slate-950/70 p-2.5 rounded-lg border border-slate-800 space-y-1">
            <span class="block text-[10px] font-bold uppercase text-slate-400 mb-1">Check-list de Serviços:</span>
            ${checklistHtml || '<span class="text-slate-500 text-xs">Nenhum item adicionado.</span>'}
          </div>

          ${m.obs ? `<p class="text-[11px] text-slate-400 italic bg-slate-950/30 p-1.5 rounded">Obs: ${m.obs}</p>` : ''}

          <div class="flex items-center justify-between text-[10px] text-slate-500 pt-1 border-t border-slate-800">
            <span>Entrada: ${m.dataCadastro}</span>
            <select onchange="alterarStatus('${m.id}', this.value)" class="bg-slate-800 border border-slate-700 text-slate-200 text-[10px] rounded px-1.5 py-1 focus:outline-none focus:border-blue-500 font-medium">
              <option value="aguardando" ${m.status === 'aguardando' ? 'selected' : ''}>Aguardando / Agendado</option>
              <option value="andamento" ${m.status === 'andamento' ? 'selected' : ''}>Em Manutenção</option>
              <option value="concluido" ${m.status === 'concluido' ? 'selected' : ''}>Concluído</option>
            </select>
          </div>
        </div>
      `;
    }

    function alternarItemChecklist(idVeiculo, indexItem) {
      manutencoes = manutencoes.map(m => {
        if (m.id === idVeiculo) {
          const novosItens = [...m.itens];
          novosItens[indexItem].feito = !novosItens[indexItem].feito;
          return { ...m, itens: novosItens };
        }
        return m;
      });
      salvarDados();
      renderizarPainel();
    }

    function alterarStatus(id, novoStatus) {
      manutencoes = manutencoes.map(m => m.id === id ? { ...m, status: novoStatus } : m);
      salvarDados();
      renderizarPainel();
    }

    function abrirModalNovoServico() {
      document.getElementById('modalServico').classList.remove('hidden');
    }

    function fecharModalNovoServico() {
      document.getElementById('modalServico').classList.add('hidden');
      document.getElementById('formServico').reset();
    }

    function salvarServico(e) {
      e.preventDefault();
      const placa = document.getElementById('inputPlaca').value.toUpperCase();
      const modelo = document.getElementById('inputModelo').value;
      const dataAgendamento = document.getElementById('inputDataAgendamento').value;
      const horaAgendamento = document.getElementById('inputHoraAgendamento').value;
      const obs = document.getElementById('inputObs').value;
      const outroItem = document.getElementById('inputOutroItem').value.trim();

      const itensSelecionados = [];
      document.querySelectorAll('.chk-item:checked').forEach(chk => {
        itensSelecionados.push({ nome: chk.value, feito: false });
      });

      if (outroItem) {
        itensSelecionados.push({ nome: outroItem, feito: false });
      }

      if (itensSelecionados.length === 0) {
        alert('Por favor, marque pelo menos um item do check-list!');
        return;
      }

      const novo = {
        id: Date.now().toString(),
        placa,
        modelo,
        dataAgendamento,
        horaAgendamento,
        obs,
        itens: itensSelecionados,
        status: 'aguardando',
        dataCadastro: new Date().toLocaleDateString('pt-BR')
      };

      manutencoes.unshift(novo);
      salvarDados();
      renderizarPainel();
      fecharModalNovoServico();
    }

    function removerRegistro(id) {
      if (confirm('Deseja excluir este veículo do controle?')) {
        manutencoes = manutencoes.filter(m => m.id !== id);
        salvarDados();
        renderizarPainel();
      }
    }

    function limparTudo() {
      if (confirm('Deseja apagar todos os veículos cadastrados?')) {
        manutencoes = [];
        salvarDados();
        renderizarPainel();
      }
    }

    function filtrarEHighlight(termo) {
      document.querySelectorAll('.card-manutencao').forEach(el => {
        const placa = el.getAttribute('data-placa');
        if (termo && placa.includes(termo)) {
          el.classList.add('highlight-search');
        } else {
          el.classList.remove('highlight-search');
        }
      });
    }

    // EXPORTAR PLANILHA EXCEL / CSV
    function exportarExcel() {
      if (manutencoes.length === 0) {
        alert('Não há dados cadastrados para exportar!');
        return;
      }

      let csvContent = "data:text/csv;charset=utf-8,\uFEFF"; // BOM para acentuação correta no Excel
      csvContent += "Placa;Modelo;Data Agendamento;Horario Agendamento;Status;Servicos / Checklist;Observacoes;Data Cadastro\n";

      manutencoes.forEach(m => {
        const dataAgendBR = formatarDataBR(m.dataAgendamento) || "Nao agendado";
        const horaAgend = m.horaAgendamento || "-";
        
        // Formatar itens do checklist (Feito / Pendente)
        const listaServicos = m.itens.map(i => `${i.nome} [${i.feito ? 'CONCLUIDO' : 'PENDENTE'}]`).join(' | ');
        
        let statusTexto = "Aguardando";
        if (m.status === 'andamento') statusTexto = "Em Manutencao";
        if (m.status === 'concluido') statusTexto = "Concluido";

        const linha = [
          `"${m.placa}"`,
          `"${m.modelo}"`,
          `"${dataAgendBR}"`,
          `"${horaAgend}"`,
          `"${statusTexto}"`,
          `"${listaServicos}"`,
          `"${m.obs || ''}"`,
          `"${m.dataCadastro}"`
        ].join(";");

        csvContent += linha + "\n";
      });

      const encodedUri = encodeURI(csvContent);
      const link = document.createElement("a");
      link.setAttribute("href", encodedUri);
      link.setAttribute("download", `relatorio_manutencao_frota_${new Date().toISOString().slice(0,10)}.csv`);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }
  </script>
</body>
</html>
